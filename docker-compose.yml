version: '3.8'

services:
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=${MONGODB_URI}
      - GEMINI_API_KEY=mock_key

  admin:
    build:
      context: ./Admin
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    depends_on:
      - backend
